server:
  port: 8082

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/order_db
    username: ${DB_USER:order_svc}
    password: ${DB_PASSWORD:order_pwd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema do Flyway quan ly (src/main/resources/db/migration)
  security:
    oauth2:
      resourceserver:
        jwt:
          # Token do auth-service cap: kiem tra "iss" + chu ky (public key lay tu /oauth2/jwks, cache lai)
          issuer-uri: ${AUTH_PUBLIC_URL:http://localhost:9000}
          jwk-set-uri: ${AUTH_INTERNAL_URL:http://localhost:9000}/oauth2/jwks
          # claim "roles": ["ADMIN"] -> authority ROLE_ADMIN -> dung hasRole('ADMIN')
          authorities-claim-name: roles
          authority-prefix: ROLE_
      client:
        # order-service tu xin token (client_credentials) de goi product-service
        registration:
          order-service:
            provider: microshop
            client-id: order-service
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET:order-service-secret}
            authorization-grant-type: client_credentials
            scope: product.read
        provider:
          microshop:
            token-uri: ${AUTH_INTERNAL_URL:http://localhost:9000}/oauth2/token
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Truyen traceId qua Kafka header -> tren Kibana thay duoc ca chuoi gateway -> order -> payment
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

microshop:
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0        # demo: trace 100% request
  otlp:
    metrics:
      export:
        enabled: false        # metrics do Prometheus keo (pull) qua /actuator/prometheus

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}   # docker-compose dat LOG_FORMAT=ecs -> log JSON cho ELK
