server:
  port: 8083

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/payment_db
    username: ${DB_USER:payment_svc}
    password: ${DB_PASSWORD:payment_pwd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema do Flyway quan ly (src/main/resources/db/migration)
  security:
    oauth2:
      resourceserver:
        jwt:
          # Token do auth-service cap: kiem tra "iss" + chu ky (public key lay tu /oauth2/jwks, cache lai)
          issuer-uri: ${AUTH_PUBLIC_URL:http://localhost:9000}
          jwk-set-uri: ${AUTH_INTERNAL_URL:http://localhost:9000}/oauth2/jwks
          # claim "roles": ["ADMIN"] -> authority ROLE_ADMIN -> dung hasRole('ADMIN')
          authorities-claim-name: roles
          authority-prefix: ROLE_
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Truyen traceId qua Kafka header -> tren Kibana thay duoc ca chuoi gateway -> order -> payment
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

microshop:
  wallet:
    initial-balance: 20000000     # moi user moi co san 20 trieu (demo). Laptop 25.99 trieu -> thieu tien
    max-top-up: 50000000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0        # demo: trace 100% request
  otlp:
    metrics:
      export:
        enabled: false        # metrics do Prometheus keo (pull) qua /actuator/prometheus

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}   # docker-compose dat LOG_FORMAT=ecs -> log JSON cho ELK
