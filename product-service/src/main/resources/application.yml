server:
  port: 8081

spring:
  application:
    name: product-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/product_db
    username: ${DB_USER:product_svc}
    password: ${DB_PASSWORD:product_pwd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema do Flyway quan ly (src/main/resources/db/migration)
  security:
    oauth2:
      resourceserver:
        jwt:
          # Token do auth-service cap: kiem tra "iss" + chu ky (public key lay tu /oauth2/jwks, cache lai)
          issuer-uri: ${AUTH_PUBLIC_URL:http://localhost:9000}
          jwk-set-uri: ${AUTH_INTERNAL_URL:http://localhost:9000}/oauth2/jwks
          # claim "roles": ["ADMIN"] -> authority ROLE_ADMIN -> dung hasRole('ADMIN')
          authorities-claim-name: roles
          authority-prefix: ROLE_
  mvc:
    problemdetails:
      enabled: true           # loi tra ve application/problem+json (RFC 9457)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0        # demo: trace 100% request
  otlp:
    metrics:
      export:
        enabled: false        # metrics do Prometheus keo (pull) qua /actuator/prometheus

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}   # docker-compose dat LOG_FORMAT=ecs -> log JSON cho ELK
