server:
  port: 9000
  servlet:
    session:
      cookie:
        # Gateway (localhost:8080) va auth-service (localhost:9000) cung host "localhost".
        # Cookie KHONG phan biet port -> dat ten khac nhau de 2 session khong de len nhau.
        name: MS_AUTH_SESSION

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db
    username: ${DB_USER:auth_svc}
    password: ${DB_PASSWORD:auth_pwd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          # Tao OAuth App tai https://github.com/settings/developers
          #   Homepage URL:               http://localhost:8080
          #   Authorization callback URL: http://localhost:9000/login/oauth2/code/github
          github:
            client-id: ${GITHUB_CLIENT_ID:change-me}
            client-secret: ${GITHUB_CLIENT_SECRET:change-me}
            scope: read:user,user:email

microshop:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    admin-github-logins: ${ADMIN_GITHUB_LOGINS:}
    demo-users: ${DEMO_USERS_ENABLED:true}
    gateway:
      client-id: api-gateway
      client-secret: ${GATEWAY_CLIENT_SECRET:gateway-secret}
      redirect-uri: ${GATEWAY_URL:http://localhost:8080}/login/oauth2/code/microshop
      post-logout-redirect-uri: ${GATEWAY_URL:http://localhost:8080}/
    order-service:
      client-id: order-service
      client-secret: ${ORDER_SERVICE_CLIENT_SECRET:order-service-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0        # demo: trace 100% request
  otlp:
    metrics:
      export:
        enabled: false        # metrics do Prometheus keo (pull) qua /actuator/prometheus

logging:
  structured:
    format:
      # Log JSON chuan ECS -> Filebeat/Logstash/Elasticsearch doc truc tiep, khong can grok
      console: ${LOG_FORMAT:}
