<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập MicroShop</title>
    <style>
        :root { --bg: #f4f5f7; --card: #fff; --text: #1f2328; --muted: #656d76; --border: #d0d7de; --primary: #1f6feb; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }
        .card { width: min(380px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--border);
                border-radius: 12px; padding: 28px; }
        h1 { font-size: 22px; margin: 0 0 4px; }
        p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
        a.github { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 11px;
                   background: #24292f; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .divider { display: flex; align-items: center; gap: 10px; margin: 22px 0; color: var(--muted); font-size: 13px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
        label { display: block; font-size: 13px; margin: 0 0 6px; }
        input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
        button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--primary); color: #fff;
                 font-weight: 600; font-size: 14px; cursor: pointer; }
        .hint { margin-top: 14px; font-size: 12px; color: var(--muted); }
        .error { background: #ffebe9; color: #82071e; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    </style>
</head>
<body>
<main class="card">
    <h1>MicroShop</h1>
    <p class="sub">Auth-Service · OAuth 2.1 / OpenID Connect</p>

    <div class="error" th:if="${param.error}">Đăng nhập thất bại. Kiểm tra lại tài khoản.</div>

    <a class="github" th:href="@{/oauth2/authorization/github}">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Đăng nhập với GitHub
    </a>

    <div class="divider">hoặc tài khoản demo</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Đăng nhập</button>
    </form>
    <p class="hint">Demo: <b>user / user</b> (USER) · <b>admin / admin</b> (USER + ADMIN)</p>
</main>
</body>
</html>
