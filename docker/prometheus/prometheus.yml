global:
  scrape_interval: 10s

# Prometheus KEO (pull) metrics tu /actuator/prometheus cua tung service.
scrape_configs:
  - job_name: microshop
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:9000
          - product-service:8081
          - order-service:8082
          - payment-service:8083
          - notification-service:8084
    relabel_configs:
      # "order-service:8082" -> label service="order-service"
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
