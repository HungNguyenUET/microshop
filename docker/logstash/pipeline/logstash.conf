# Filebeat -> Logstash -> Elasticsearch
input {
  beats { port => 5044 }
}

filter {
  # Service log JSON chuan ECS (logging.structured.format.console=ecs) -> parse thanh field
  if [message] =~ /^\{/ {
    json {
      source => "message"
      skip_on_invalid_json => true
      remove_field => ["message"]
      target => "app"
    }
    if [app] {
      mutate {
        rename => {
          "[app][message]"       => "message"
          "[app][log][level]"    => "level"
          "[app][log][logger]"   => "logger"
          "[app][service][name]" => "service"
          "[app][traceId]"       => "traceId"
          "[app][spanId]"        => "spanId"
          "[app][@timestamp]"    => "app_timestamp"
        }
      }
      if [app][error] { mutate { rename => { "[app][error]" => "error" } } }
      if [app_timestamp] { date { match => ["app_timestamp", "ISO8601"] remove_field => ["app_timestamp"] } }
      mutate { remove_field => ["app"] }
    }
  }
  mutate { remove_field => ["agent", "ecs", "input", "host", "log", "event"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microshop-logs-%{+YYYY.MM.dd}"
  }
}
